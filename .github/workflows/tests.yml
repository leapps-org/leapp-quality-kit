name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no config, no network)
        env:
          LEAPP_QUALITY_CONFIG: /nonexistent/config.json
        run: |
          set -e
          for folder in review-gate notes-audit number-recheck mac-pr-reviewer; do
            echo "== $folder"
            python -B -m unittest discover -s "$folder"
          done
      - name: Shell syntax
        run: bash -n notes-audit/run_corpus.sh && bash -n number-recheck/weekly.sh
